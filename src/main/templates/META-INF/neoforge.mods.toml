# Tipo do carregador de mods - para NeoForge deve ser javafml
modLoader="javafml"

# Intervalo de versão do carregador (puxado do gradle.properties)
loaderVersion="${loader_version_range}"

# Licença do seu mod
license="${mod_license}"

# Declaração do bloco do mod
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

# Quem criou o mod
authors="Gabriel"

# A descrição do seu mod
description='''
Um mod que pacifica monstros e criaturas do Minecraft quando recebem uma Tag com o nome de 'Amigao'.
Feito para a versão 1.21.1 usando NeoForge!
'''

# Dependência Obrigatória: NeoForge
[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

# Dependência Obrigatória: Minecraft Base
[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"